name: cpp-parity

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libfftw3-dev \
            libopenblas-dev \
            liblapacke-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib astropy ipython pybind11 pytest
          python -m pip install -e .
          LINA_USE_CUDA=0 python -m pip install -e ./lina_cpp

      - name: Run canonical parity suite
        run: |
          python -m pytest lina/tests/test_per_method_parity.py -q
